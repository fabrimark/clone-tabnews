services:
  database:
    container_name: "postgres-dev"
    image: "postgres:16.13-alpine3.23"
    env_file:
      - ../.env.development
    ports:
      - "5432:5432"

  database-test:
    image: "postgres:16.13-alpine3.23"
    environment:
      POSTGRES_DB: "clone_tabnews_test"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
    ports:
      - "127.0.0.1:5433:5432"
